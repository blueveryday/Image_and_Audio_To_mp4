name: Build Windows EXE

on:
  push:
    branches: [ C ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 先在 Linux 上跑核心逻辑的测试(命令生成、参数解析,并用真实 ffmpeg 合成后用 ffprobe 检查输出)
  test-core:
    name: Core tests (Linux + ffmpeg)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Build tests
        run: |
          cmake -S . -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test

      - name: Run tests
        run: ctest --test-dir build-test --output-on-failure

  build-windows:
    name: Build on Windows (MSVC)
    needs: test-core
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只为了让 dumpbin 在 PATH 里(下面检查 exe 的依赖用)
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Locate exe
        shell: pwsh
        run: |
          $exe = "build/Release/ImageAudioTomp4.exe"
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          Get-Item $exe | Format-List Name, Length

      # CRT 是静态链接的,不应依赖 VC++ 运行库,否则在没装运行库的电脑上无法启动
      - name: Verify no VC++ runtime dependency
        shell: pwsh
        run: |
          $deps = dumpbin /dependents build/Release/ImageAudioTomp4.exe | Out-String
          Write-Host $deps
          if ($deps -match '(?i)vcruntime|msvcp|ucrtbase|api-ms-win-crt|concrt') {
            throw "exe 依赖 VC++ 运行库,请检查 MSVC_RUNTIME_LIBRARY 设置"
          }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/ImageAudioTomp4" | Out-Null
          Copy-Item "build/Release/ImageAudioTomp4.exe" "dist/ImageAudioTomp4/"
          if (-not (Test-Path "dist/ImageAudioTomp4/ImageAudioTomp4.exe")) { throw "复制 exe 失败" }

      - name: Extract FFmpeg and FFprobe
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          $archive = "assets/ffmpeg-win64.7z"
          if (-not (Test-Path $archive)) { throw "找不到 $archive" }
          & $sevenZip x $archive -o"dist/ImageAudioTomp4" -y
          if (-not (Test-Path "dist/ImageAudioTomp4/ffmpeg.exe"))  { throw "ffmpeg.exe 解压失败" }
          if (-not (Test-Path "dist/ImageAudioTomp4/ffprobe.exe")) { throw "ffprobe.exe 解压失败" }
          Get-ChildItem "dist/ImageAudioTomp4" | Format-Table Name, Length

      - name: Package with 7z (include commit SHA)
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $archiveName = "ImageAudioTomp4-$shortSha.7z"
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          Push-Location dist
          & $sevenZip a -t7z -mx=9 $archiveName "ImageAudioTomp4"
          Pop-Location
          if (-not (Test-Path "dist/$archiveName")) {
            throw "7z 压缩失败：未找到 dist/$archiveName"
          }
          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
          "SHORT_SHA=$shortSha"       >> $env:GITHUB_ENV
          Get-Item "dist/$archiveName" | Format-List Name, Length

      - name: Verify archive layout
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }
          & $sevenZip l "dist/$env:ARCHIVE_NAME" | Select-Object -First 20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageAudioTomp4-${{ env.SHORT_SHA }}
          path: dist/${{ env.ARCHIVE_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: v2.0.${{ github.run_number }}
          files: dist/${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
